services:
  tts-server:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.dev
      args:
        BASE: nvidia/cuda:11.8.0-base-ubuntu22.04
    image: coqui-ai-tts-server:gpu
    gpus: all
    ports:
      - "5002:5002"
    environment:
      - DEVICE=cuda
    command: ["python3", "TTS/server/server.py", "--device", "cuda" ]