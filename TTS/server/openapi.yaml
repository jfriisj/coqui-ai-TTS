components:
  schemas:
    BatchTTSRequest:
      properties:
        texts:
          items:
            type: string
          type: array
          maxItems: 10
          minItems: 1
          title: Texts
          description: List of texts to synthesize
        speaker_name:
          anyOf:
            - type: string

          title: Speaker Name
          description: Speaker name for multi-speaker models
        language_name:
          anyOf:
            - type: string

          title: Language Name
          description: Language name for multilingual models
        speaker_wav:
          anyOf:
            - type: string

          title: Speaker Wav
          description: Path or URL to speaker wav file for voice cloning
        split_sentences:
          type: boolean
          title: Split Sentences
          description: Split text into sentences for synthesis
          default: true
        format:
          type: string
          pattern: "^(wav|mp3|opus|aac|flac|pcm)$"
          title: Format
          description: Output audio format
          default: wav
        concatenate:
          type: boolean
          title: Concatenate
          description: Concatenate all audio files into one
          default: true
      type: object
      required:
        - texts
      title: BatchTTSRequest
    Body_api_v1_voice_convert_api_v1_voice_convert_post:
      properties:
        source_wav:
          type: string
          format: binary
          title: Source Wav
          description: Source audio file
        target_wav:
          type: string
          format: binary
          title: Target Wav
          description: Target audio file for voice characteristics
      type: object
      required:
        - source_wav
        - target_wav
      title: Body_api_v1_voice_convert_api_v1_voice_convert_post
    EnhancedTTSRequest:
      properties:
        text:
          type: string
          maxLength: 5000
          minLength: 1
          title: Text
          description: Text to synthesize
        speaker_name:
          anyOf:
            - type: string

          title: Speaker Name
          description: Speaker name for multi-speaker models
        language_name:
          anyOf:
            - type: string

          title: Language Name
          description: Language name for multilingual models
        speaker_wav:
          anyOf:
            - type: string

          title: Speaker Wav
          description: Path or URL to speaker wav file for voice cloning
        style_wav:
          anyOf:
            - type: string

          title: Style Wav
          description: Path or URL to style wav file for GST models
        style_text:
          anyOf:
            - type: string

          title: Style Text
          description: Transcription of style_wav for Capacitron models
        source_wav:
          anyOf:
            - type: string

          title: Source Wav
          description: Source wav file for voice conversion
        source_speaker_name:
          anyOf:
            - type: string

          title: Source Speaker Name
          description: Source speaker name for voice conversion
        split_sentences:
          type: boolean
          title: Split Sentences
          description: Split text into sentences for synthesis
          default: true
        voice_dir:
          anyOf:
            - type: string

          title: Voice Dir
          description: Directory for cached voices
        format:
          type: string
          pattern: "^(wav|mp3|opus|aac|flac|pcm)$"
          title: Format
          description: Output audio format
          default: wav
      type: object
      required:
        - text
      title: EnhancedTTSRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            "$ref": "#/components/schemas/ValidationError"
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: Overall health status
        model_loaded:
          type: boolean
          title: Model Loaded
          description: Whether a TTS model is currently loaded
        components:
          additionalProperties: true
          type: object
          title: Components
          description: Status of individual components
        cache:
          anyOf:
